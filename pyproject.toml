[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-builder-ai"
version = "0.1.0"
description = "App Builder AI — IDE AI local-first tạo ứng dụng mobile React Native/Expo trên Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "keyring>=24",
]

[project.optional-dependencies]
ai = [
    "openai>=1.40",
    "anthropic>=0.40",
    "google-genai>=1.0",
    "httpx>=0.27",
]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.scripts]
app-builder-ai = "app_builder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_builder = ["resources/**/*", "resources/**/.*", "resources/templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: test chạy npm install/typecheck thật (cần mạng, opt-in qua APPBUILDER_RUN_SLOW=1)",
    "ui: smoke test giao diện Qt (offscreen)",
]
