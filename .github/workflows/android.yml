name: Android build & test

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-*"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/android-*"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests (core)
        run: gradle --no-daemon :core:test

      - name: Build debug APK
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/QuetCalo-debug.apk
          ls -la ../dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuetCalo-android-apk
          path: dist/QuetCalo-debug.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: ignore

  screenshots:
    name: Emulator smoke test & screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: QuetCalo-android-apk
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/android-screenshots.sh dist/QuetCalo-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: android-screenshots/
          if-no-files-found: ignore
