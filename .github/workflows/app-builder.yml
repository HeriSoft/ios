name: App Builder tests

on:
  push:
    paths:
      - "app-builder/**"
      - ".github/workflows/app-builder.yml"
  pull_request:
    paths:
      - "app-builder/**"
      - ".github/workflows/app-builder.yml"
  workflow_dispatch:

concurrency:
  group: app-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Windows, Qt offscreen)
    # App Builder là app desktop cho Windows: chạy test trên Windows thật.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app-builder
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ai]" pytest

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

      - name: Doctor (CLI)
        if: always()
        run: python -m app_builder doctor
