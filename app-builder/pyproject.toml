[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-builder-ai"
version = "0.1.0"
description = "App Builder AI — IDE AI local-first tạo ứng dụng mobile React Native/Expo trên Windows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "keyring>=24",
    # SDK chính thức của các provider AI (M2). Mốc tối thiểu = phiên bản đã kiểm thử.
    "openai>=3.60",
    "anthropic>=2.14",
    "google-genai>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[project.scripts]
app-builder-ai = "app_builder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_builder = ["resources/**/*", "resources/**/.*", "resources/templates/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: test chạy npm install/typecheck thật (cần mạng, opt-in qua APPBUILDER_RUN_SLOW=1)",
    "ui: smoke test giao diện Qt (offscreen)",
    "live: gọi API AI thật, chỉ chạy khi có APPBUILDER_LIVE_<PROVIDER>_KEY (tốn phí)",
]
