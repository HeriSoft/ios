name: CalorieScan
options:
  bundleIdPrefix: com.herisoft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CalorieScan:
    type: application
    platform: iOS
    sources:
      - CalorieScan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herisoft.caloriescan
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Quét Calo"
        INFOPLIST_KEY_NSCameraUsageDescription: "Ứng dụng cần camera để quét mã vạch, mã QR và nhãn dinh dưỡng trên bao bì sản phẩm."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  CalorieScanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CalorieScanTests
    dependencies:
      - target: CalorieScan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.herisoft.caloriescan.tests
schemes:
  CalorieScan:
    build:
      targets:
        CalorieScan: all
        CalorieScanTests: [test]
    test:
      targets:
        - CalorieScanTests
